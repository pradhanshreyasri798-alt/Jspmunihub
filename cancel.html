<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled | Jspmunihub</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f5, #fff4ee);
      }
      .cancel-box {
        max-width: 600px;
        background: white;
        border: 1px solid #f1d5d5;
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        padding: 40px 30px;
        text-align: center;
      }
      .cancel-box h1 {
        color: #c53030;
        margin-bottom: 12px;
      }
      .cancel-box p {
        color: #5d6980;
      }
      .cancel-box a {
        display: inline-block;
        margin-top: 20px;
        background: #1d4ed8;
        color: white;
        padding: 0.8rem 1.2rem;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="cancel-box">
      <h1>Payment Cancelled</h1>
      <p>Your payment was cancelled. No charge has been made.</p>
      <a href="/">Return to Jspmunihub</a>
    </div>
  </body>
</html>

        background: linear-gradient(135deg, #edf5ff, #eefaf0);
      }
      .success-box {
        max-width: 600px;
        background: white;
        border: 1px solid #e6ebf2;
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        padding: 40px 30px;
        text-align: center;
      }
      .success-box h1 {
        color: #0f9f4c;
        margin-bottom: 12px;
      }
      .success-box p {
        color: #5d6980;
      }
      .success-box a {
        display: inline-block;
        margin-top: 20px;
        background: #1d4ed8;
        color: white;
        padding: 0.8rem 1.2rem;
        border-radius: 12px;
        font-weight: 700;
      }
